         aus, wenn es unverändert ist. Bei einem Wechsel der Version Hash neu berechnen:
         curl -s https://gc.zgo.at/count.vN.js | openssl dgst -sha384 -binary | openssl base64 -A -->
    <script data-goatcounter="https://knotenc.goatcounter.com/count"
            async src="https://gc.zgo.at/count.v4.js" crossorigin="anonymous"
            integrity="sha384-OLBgp1GsljhM2TJ+sbHjaiH9txEUvgdDTAzHv2P24donTt6/529l+9Ua0vFImLlb"></script>
  </head>
